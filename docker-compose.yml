services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uj_ai_club}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uj_ai_club_dev}
      POSTGRES_DB: ${POSTGRES_DB:-uj_ai_club}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-uj_ai_club} -d ${POSTGRES_DB:-uj_ai_club}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  jupyterhub:
    build:
      context: ./jupyterhub
    env_file: .env
    environment:
      DOCKER_NETWORK_NAME: internal
      STUDENT_ISOLATED_NETWORK_NAME: students
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8000}
      MAIN_APP_URL: ${MAIN_APP_URL:-http://localhost:3000}
      NOTEBOOKS_VOLUME_NAME: uj-ai-club-backend_uploads_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nbgrader_exchange:/srv/nbgrader/exchange
      - jupyterhub_data:/data
      # Bind host uploads/ so `cargo run` on the host and Docker share notebooks
      - ./uploads:/srv/notebooks
    ports:
      - "127.0.0.1:8888:8000"
    networks:
      - internal
      - students
    restart: unless-stopped

  grading:
    build:
      context: ./grading
    env_file: .env
    environment:
      GRADING_SERVICE_SECRET: ${GRADING_SERVICE_SECRET}
      GRADING_WEBHOOK_URL: ${GRADING_WEBHOOK_URL:-http://host.docker.internal:8000/webhooks/nbgrader/grade}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same host folder the Rust API writes to under cargo run
      - ./uploads:/srv/notebooks
      - nbgrader_exchange:/srv/nbgrader/exchange
      - nbgrader_course:/srv/nbgrader/course
      - nbgrader_data:/data
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  nbgrader_exchange:
  nbgrader_course:
  nbgrader_data:
  jupyterhub_data:

networks:
  internal:
    name: internal
  students:
    name: students
    internal: true
