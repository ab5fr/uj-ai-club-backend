name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - src/**
      - migrations/**
      - jupyterhub/**
      - grading/**
      - .dockerignore
      - .github/workflows/build-and-push-images.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ab5fr

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'Dockerfile'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'src/**'
              - 'migrations/**'
              - '.dockerignore'
            jupyterhub:
              - 'jupyterhub/**'
              - '!jupyterhub/student-notebook/**'
            student_notebook:
              - 'jupyterhub/student-notebook/**'
            grading:
              - 'grading/**'
            workflow:
              - '.github/workflows/build-and-push-images.yml'

      - name: Build matrix JSON
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail

          build_all=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            build_all=true
          elif [[ "${{ steps.filter.outputs.workflow }}" == "true" ]]; then
            build_all=true
          fi

          images='[]'
          add_image() {
            local name="$1" context="$2" dockerfile="$3"
            images=$(jq -c \
              --arg name "$name" \
              --arg context "$context" \
              --arg dockerfile "$dockerfile" \
              '. + [{image_name:$name, context:$context, dockerfile:$dockerfile}]' \
              <<<"$images")
          }

          if $build_all || [[ "${{ steps.filter.outputs.server }}" == "true" ]]; then
            add_image "uj-ai-club-backend-server" "." "Dockerfile"
          fi
          if $build_all || [[ "${{ steps.filter.outputs.jupyterhub }}" == "true" ]]; then
            add_image "uj-ai-club-backend-jupyterhub" "jupyterhub" "Dockerfile"
          fi
          if $build_all || [[ "${{ steps.filter.outputs.student_notebook }}" == "true" ]]; then
            add_image "uj-ai-club-backend-student-notebook" "jupyterhub/student-notebook" "Dockerfile"
          fi
          if $build_all || [[ "${{ steps.filter.outputs.grading }}" == "true" ]]; then
            add_image "uj-ai-club-backend-grading" "grading" "Dockerfile"
          fi

          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Selected images: $images"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.images) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve Dockerfile path
        id: dockerfile
        shell: bash
        run: |
          if [[ "${{ matrix.context }}" == "." ]]; then
            echo "file=Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=${{ matrix.context }}/${{ matrix.dockerfile }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
