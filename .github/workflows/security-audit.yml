name: Security audit

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - grading/**
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - grading/**
      - .github/workflows/security-audit.yml
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit and grading deps
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install "nbgrader==0.9.*" watchdog requests flask docker

      - name: Run pip-audit
        run: pip-audit
